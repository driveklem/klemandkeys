<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Admin Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17887589364"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'AW-17887589364');
    </script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Admin Authentication Debugger</h3>
                    </div>
                    <div class="card-body">
                        <div id="output" class="mb-3">
                            <p class="text-muted">Loading diagnostics...</p>
                        </div>

                        <hr>

                        <h5>Test Login</h5>
                        <form id="testLoginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="testEmail" class="form-control"
                                    value="contact@klemandkeysrealty.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="testPassword" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary">Test Login</button>
                        </form>

                        <div id="testOutput" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script>
        const output = document.getElementById('output');
        const testOutput = document.getElementById('testOutput');

        async function runDiagnostics() {
            let html = '<div class="alert alert-info">Running diagnostics...</div>';
            output.innerHTML = html;

            const results = [];

            // 1. Check Supabase Client
            results.push({
                test: 'Supabase Client Initialized',
                status: window.supabaseClient ? 'PASS' : 'FAIL',
                details: window.supabaseClient ? 'Client is available' : 'Client not found'
            });

            // 2. Check Current Session
            try {
                const { data: { session }, error } = await window.supabaseClient.auth.getSession();
                results.push({
                    test: 'Get Current Session',
                    status: error ? 'FAIL' : 'PASS',
                    details: error ? error.message : (session ? `Logged in as: ${session.user.email}` : 'No active session')
                });

                if (session) {
                    results.push({
                        test: 'User ID',
                        status: 'INFO',
                        details: session.user.id
                    });
                }
            } catch (err) {
                results.push({
                    test: 'Get Current Session',
                    status: 'ERROR',
                    details: err.message
                });
            }

            // 3. Check admin_users table access
            try {
                const { data, error } = await window.supabaseClient
                    .from('admin_users')
                    .select('*')
                    .limit(1);

                results.push({
                    test: 'Query admin_users table',
                    status: error ? 'FAIL' : 'PASS',
                    details: error ? `Error: ${error.message} (Code: ${error.code})` : `Success - Found ${data?.length || 0} records`
                });
            } catch (err) {
                results.push({
                    test: 'Query admin_users table',
                    status: 'ERROR',
                    details: err.message
                });
            }

            // 4. Check if table exists with count
            try {
                const { count, error } = await window.supabaseClient
                    .from('admin_users')
                    .select('*', { count: 'exact', head: true });

                results.push({
                    test: 'Count admin_users records',
                    status: error ? 'FAIL' : 'PASS',
                    details: error ? error.message : `Total records: ${count}`
                });
            } catch (err) {
                results.push({
                    test: 'Count admin_users records',
                    status: 'ERROR',
                    details: err.message
                });
            }

            // Display results
            html = '<h5>Diagnostic Results</h5>';
            results.forEach(result => {
                const badgeClass = result.status === 'PASS' ? 'success' :
                    result.status === 'FAIL' ? 'danger' :
                        result.status === 'ERROR' ? 'warning' : 'info';
                html += `
                    <div class="card mb-2">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <strong>${result.test}</strong>
                                <span class="badge bg-${badgeClass}">${result.status}</span>
                            </div>
                            <small class="text-muted">${result.details}</small>
                        </div>
                    </div>
                `;
            });

            output.innerHTML = html;
        }

        // Test login function
        document.getElementById('testLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;

            testOutput.innerHTML = '<div class="alert alert-info">Testing login...</div>';

            try {
                // Step 1: Sign in
                const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    testOutput.innerHTML = `<div class="alert alert-danger">
                        <strong>Auth Error:</strong> ${authError.message}
                    </div>`;
                    return;
                }

                testOutput.innerHTML = `<div class="alert alert-success">
                    ✓ Authentication successful!<br>
                    User ID: ${authData.user.id}<br>
                    Email: ${authData.user.email}
                </div>`;

                // Step 2: Check admin_users table
                const { data: adminData, error: adminError } = await window.supabaseClient
                    .from('admin_users')
                    .select('*')
                    .eq('id', authData.user.id)
                    .single();

                if (adminError) {
                    testOutput.innerHTML += `<div class="alert alert-danger">
                        <strong>Admin Check Error:</strong><br>
                        Message: ${adminError.message}<br>
                        Code: ${adminError.code}<br>
                        Details: ${adminError.details || 'None'}<br>
                        Hint: ${adminError.hint || 'None'}
                    </div>`;
                } else if (!adminData) {
                    testOutput.innerHTML += `<div class="alert alert-warning">
                        ⚠ User authenticated but not found in admin_users table
                    </div>`;
                } else {
                    testOutput.innerHTML += `<div class="alert alert-success">
                        ✓ Admin verification successful!<br>
                        Admin data: ${JSON.stringify(adminData, null, 2)}
                    </div>`;
                }

            } catch (err) {
                testOutput.innerHTML = `<div class="alert alert-danger">
                    <strong>Unexpected Error:</strong> ${err.message}
                </div>`;
            }
        });

        // Run diagnostics on load
        runDiagnostics();
    </script>
</body>

</html>
