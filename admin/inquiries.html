<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiries | Klem & Keys Admin</title>

    <!-- Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Premium Admin CSS -->
    <link rel="stylesheet" href="../assets/css/admin/dashboard.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17887589364"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'AW-17887589364');
    </script>
</head>

<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-wrapper">
                    <img src="../assets/img/logo-1.png" alt="Logo" class="brand-logo">
                </a>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-label">Main Menu</li>
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="properties.html" class="menu-link">
                        <i class="fas fa-building"></i>
                        <span>Properties</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="property-add.html" class="menu-link">
                        <i class="fas fa-plus-circle"></i>
                        <span>Add Property</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="inquiries.html" class="menu-link active">
                        <i class="fas fa-envelope-open-text"></i>
                        <span>Inquiries</span>
                        <span class="badge bg-danger ms-auto" id="unreadInquiriesBadge" style="display: none;">0</span>
                    </a>
                </li>

                <li class="menu-label">Settings</li>
                <li class="menu-item">
                    <a href="configuration.html" class="menu-link">
                        <i class="fas fa-cog"></i>
                        <span>Configuration</span>
                    </a>
                </li>
                <li class="menu-item mt-4">
                    <a href="../index.html" class="menu-link">
                        <i class="fas fa-external-link-alt"></i>
                        <span>Back to Website</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">A</div>
                    <div class="user-details">
                        <h4>Admin User</h4>
                        <span>Super Admin</span>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-logout-ghost">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="d-flex align-items-center">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-path">
                        Pages / <strong>Inquiries</strong>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <h1 class="welcome-title mb-4">Client Inquiries</h1>

                <!-- Inquiry Stats -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card py-3">
                            <div>
                                <div class="stat-value text-primary">0</div>
                                <div class="stat-label">Total Messages</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card py-3">
                            <div>
                                <div class="stat-value text-warning">0</div>
                                <div class="stat-label">Unread</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Inquiries List -->
                <div class="card-table">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Client Info</th>
                                    <th>Property</th>
                                    <th>Message</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dynamic content loaded here -->
                                <tr>
                                    <td colspan="6" class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status"></div>
                                        <p class="mt-2">Loading inquiries...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Mobile Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/admin/auth-guard.js"></script>

    <script src="../assets/js/admin/dashboard.js"></script>
    <script src="../assets/js/admin/inquiries.js"></script>
</body>

</html>
